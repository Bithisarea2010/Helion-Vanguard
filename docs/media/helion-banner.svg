<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Helion Vanguard</title>
  <desc id="desc">A cinematic deep-space banner with a Vanguard fighter, a sunlit planet and tactical interface graphics.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020616"/>
      <stop offset="0.48" stop-color="#101044"/>
      <stop offset="1" stop-color="#25081f"/>
    </linearGradient>
    <radialGradient id="nebula" cx="52%" cy="42%" r="62%">
      <stop offset="0" stop-color="#6733a8" stop-opacity=".38"/>
      <stop offset=".44" stop-color="#152f78" stop-opacity=".22"/>
      <stop offset="1" stop-color="#020616" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#fff8db"/>
      <stop offset=".12" stop-color="#ffd575"/>
      <stop offset=".42" stop-color="#ff8e32" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ff5b24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d69445"/>
      <stop offset=".16" stop-color="#613b53"/>
      <stop offset=".58" stop-color="#101528"/>
      <stop offset="1" stop-color="#040713"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e7f3"/>
      <stop offset=".26" stop-color="#6684a4"/>
      <stop offset=".57" stop-color="#26364e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7433"/>
      <stop offset="1" stop-color="#ffc65c"/>
    </linearGradient>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="frame"><rect x="18" y="18" width="1564" height="604" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="640" fill="url(#space)"/>
    <rect width="1600" height="640" fill="url(#nebula)"/>
    <path d="M0 470 C260 330 470 520 760 352 S1260 165 1600 280" fill="none" stroke="#6535a0" stroke-opacity=".16" stroke-width="110" filter="url(#softGlow)"/>

    <g fill="#d8f5ff">
      <circle cx="92" cy="102" r="1.6"/><circle cx="168" cy="198" r="1"/><circle cx="247" cy="82" r="1.2"/>
      <circle cx="331" cy="254" r="1.5"/><circle cx="407" cy="133" r=".9"/><circle cx="502" cy="70" r="1.4"/>
      <circle cx="596" cy="210" r="1"/><circle cx="690" cy="109" r="1.6"/><circle cx="786" cy="62" r=".9"/>
      <circle cx="878" cy="182" r="1.2"/><circle cx="965" cy="92" r="1.8"/><circle cx="1070" cy="238" r="1"/>
      <circle cx="1170" cy="74" r="1.3"/><circle cx="1258" cy="196" r="1.7"/><circle cx="1372" cy="104" r="1"/>
      <circle cx="1497" cy="245" r="1.5"/><circle cx="1435" cy="424" r="1"/><circle cx="1162" cy="506" r="1.4"/>
      <circle cx="1021" cy="448" r=".9"/><circle cx="828" cy="540" r="1.6"/><circle cx="607" cy="471" r="1"/>
      <circle cx="433" cy="557" r="1.5"/><circle cx="276" cy="442" r="1"/><circle cx="106" cy="536" r="1.7"/>
    </g>
    <g fill="#ffcb7a" opacity=".85">
      <circle cx="210" cy="322" r="1.4"/><circle cx="558" cy="325" r="1.2"/><circle cx="919" cy="310" r="1.5"/>
      <circle cx="1293" cy="361" r="1.2"/><circle cx="1521" cy="89" r="1.4"/>
    </g>

    <circle cx="1490" cy="72" r="245" fill="url(#sun)"/>
    <circle cx="1565" cy="238" r="300" fill="url(#planet)"/>
    <path d="M1325 20 A300 300 0 0 0 1290 353" fill="none" stroke="#ffae4e" stroke-width="6" opacity=".92" filter="url(#cyanGlow)"/>

    <g transform="translate(1020 322) rotate(-7)">
      <path d="M-380 18 L-250 -18 L-140 -30 L-46 -122 L8 -138 L56 -45 L300 -9 L365 15 L298 36 L70 56 L15 142 L-40 128 L-150 52 L-285 58 Z" fill="#050a14" opacity=".72" filter="url(#softGlow)"/>
      <path d="M-366 0 L-248 -35 L-118 -38 L-38 -128 L7 -137 L60 -45 L292 -15 L353 6 L288 26 L66 40 L14 126 L-31 114 L-142 39 L-278 43 Z" fill="url(#hull)" stroke="#9bc9e6" stroke-opacity=".68" stroke-width="2"/>
      <path d="M-132 -37 L-45 -112 L-2 -124 L2 103 L-34 98 L-143 29 Z" fill="#1a263b"/>
      <path d="M-340 1 L-230 -21 L-168 -24 L-132 -7 L-198 9 L-300 20 Z" fill="#9fb4c8" opacity=".68"/>
      <path d="M16 -113 L48 -42 L255 -10 L85 5 L13 -5 Z" fill="#526a87"/>
      <path d="M4 -122 L37 -53 L27 88 L3 107 Z" fill="url(#amber)" opacity=".9"/>
      <path d="M-122 -27 L-30 -88 M-139 22 L-34 79 M70 -27 L249 -7 M64 25 L242 12" stroke="#c6e9ff" stroke-opacity=".48" stroke-width="3"/>
      <path d="M-269 -17 L-363 -1 L-282 23" fill="none" stroke="#40d9ff" stroke-width="5" filter="url(#cyanGlow)"/>
      <ellipse cx="-354" cy="0" rx="18" ry="9" fill="#c8fbff" filter="url(#cyanGlow)"/>
      <ellipse cx="-327" cy="-16" rx="13" ry="7" fill="#57ddff" filter="url(#cyanGlow)"/>
      <ellipse cx="-326" cy="17" rx="13" ry="7" fill="#57ddff" filter="url(#cyanGlow)"/>
      <path d="M-370 0 H-520 M-342 -16 H-468 M-342 17 H-456" stroke="#42d7ff" stroke-width="5" opacity=".78" filter="url(#cyanGlow)"/>
    </g>

    <g fill="none" stroke="#4ddcff" stroke-opacity=".56">
      <path d="M66 138 V76 H128 M1472 76 H1534 V138" stroke-width="3"/>
      <path d="M66 502 V564 H128 M1472 564 H1534 V502" stroke-width="3"/>
      <path d="M115 320 H270 M1330 320 H1485" stroke-width="1.5"/>
      <circle cx="800" cy="320" r="182" stroke-dasharray="2 18" opacity=".32"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#65ddff" opacity=".78" letter-spacing="2">
      <text x="84" y="102">HV // COMBAT SYSTEMS ONLINE</text>
      <text x="84" y="548">VECTOR LOCK 07-A</text>
      <text x="1287" y="548">MACOS BUILD 1.2.1</text>
    </g>

    <g transform="translate(92 250)">
      <text x="0" y="0" fill="#eef9ff" font-family="Arial, Helvetica, sans-serif" font-size="77" font-weight="800" letter-spacing="12">HELION</text>
      <text x="5" y="70" fill="url(#amber)" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" letter-spacing="20">VANGUARD</text>
      <rect x="5" y="95" width="390" height="2" fill="#51dbff" opacity=".75"/>
      <text x="5" y="127" fill="#a8c4d7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="4">FLY HARD  /  STRIKE FIRST  /  SURVIVE</text>
    </g>
  </g>
  <rect x="18" y="18" width="1564" height="604" rx="22" fill="none" stroke="#4cdcff" stroke-opacity=".32" stroke-width="2"/>
</svg>
